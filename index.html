<title>Mein Gartenkalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: ein Gartenjournal – grosser Monatsname, Monatsleiste, Aufgaben nach Arbeitsgang gruppiert; zweite Ansicht = Jahresstreifen pro Pflanze */
:root{
  --bg:#EEF1EA; --surface:#FFFFFF; --ink:#1E2A21; --muted:#5D6A5F; --line:#D5DCD0;
  --accent:#4E46A8; --accent-soft:#E6E4F6; --bloom:#D9579A; --bloom-soft:#F7DDEA;
  --c-s:#B4532F; --c-d:#3D7A33; --c-w:#2F6596; --c-p:#9A7420; --c-g:#25807B; --c-k:#A8356A;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A16; --surface:#1C241E; --ink:#E7EDE6; --muted:#9AA79C; --line:#2E3A31;
  --accent:#A9A2F2; --accent-soft:#2A2850; --bloom:#F08CBF; --bloom-soft:#43243A;
  --c-s:#E58A66; --c-d:#86C779; --c-w:#7DB2E3; --c-p:#D9B45C; --c-g:#6CC9C2; --c-k:#E683B1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A16; --surface:#1C241E; --ink:#E7EDE6; --muted:#9AA79C; --line:#2E3A31;
  --accent:#A9A2F2; --accent-soft:#2A2850; --bloom:#F08CBF; --bloom-soft:#43243A;
  --c-s:#E58A66; --c-d:#86C779; --c-w:#7DB2E3; --c-p:#D9B45C; --c-g:#6CC9C2; --c-k:#E683B1;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,9vw,64px);line-height:1;margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin-top:6px}
.views{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.views button{font:inherit;font-weight:600;border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;overflow-x:auto}
.months button{font:inherit;font-size:13px;font-weight:600;border:1px solid transparent;background:none;color:var(--muted);
  padding:8px 0 6px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:40px}
.months button:hover{background:var(--surface)}
.months button[aria-pressed="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.months .bar{width:70%;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.months .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}
.months .now{font-size:10px;color:var(--accent);line-height:1}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bloomrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bloomrow .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;background:var(--bloom-soft);color:var(--ink)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bloom)}
.progress{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.progress .track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress .track i{display:block;height:100%;background:var(--accent);transition:width .3s}
.group{display:flex;flex-direction:column;gap:8px}
.group h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;display:flex;align-items:center;gap:10px}
.group h2 .dot{width:12px;height:12px;border-radius:3px;background:var(--tc)}
.group h2 small{font-family:var(--body);font-size:13px;color:var(--muted)}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--tc);border-radius:10px;padding:12px 14px;cursor:pointer}
.task input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--tc);cursor:pointer}
.task .who{font-weight:600}
.task .who span{color:var(--muted);font-weight:500}
.task .txt{min-width:0}
.task.done{opacity:.55}
.task.done .what{text-decoration:line-through}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.legend i.b{background:var(--bloom);border-radius:50%}
.plist{display:flex;flex-direction:column;gap:8px}
details.plant{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.plant summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:8px 16px;align-items:center}
details.plant summary::-webkit-details-marker{display:none}
.pname{font-weight:600}
.pname .n{font-variant-numeric:tabular-nums;color:var(--accent);margin-right:6px}
.pbot{font-size:13px;color:var(--muted);font-style:italic}
.cat{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.year{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.year div{display:flex;flex-direction:column;align-items:center;gap:2px}
.year .m{font-size:10px;color:var(--muted);line-height:1}
.year .cell{width:100%;height:22px;border-radius:4px;background:var(--bg);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:2px}
.year .cell.bl{background:var(--bloom-soft);box-shadow:inset 0 -3px 0 var(--bloom)}
.year .cell.cur{outline:1.5px solid var(--accent)}
.year .cell i{width:6px;height:6px;border-radius:2px;background:var(--tc)}
.pbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.tl{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:14px}
.tl b{font-weight:600;color:var(--tc);font-size:13px}
.tl .ty{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
footer{font-size:13px;color:var(--muted)}
@media (max-width:560px){
  details.plant summary{grid-template-columns:1fr}
  .months{grid-template-columns:repeat(6,1fr)}
  .tl li{grid-template-columns:72px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Gartenkalender · <span id="plantTotal"></span> Pflanzen</div>
      <h1 id="title">Oktober</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="views" role="group" aria-label="Ansicht">
      <button id="vMonth" aria-pressed="true">Monat</button>
      <button id="vPlants" aria-pressed="false">Pflanzen</button>
    </div>
  </header>

  <nav class="months" id="months" aria-label="Monat wählen"></nav>

  <section id="monthView" class="wrap" style="gap:22px">
    <div class="bloomrow" id="bloom"></div>
    <div class="progress"><span id="progTxt"></span><div class="track"><i id="progBar"></i></div></div>
    <div id="groups" class="wrap" style="gap:22px"></div>
  </section>

  <section id="plantView" hidden class="wrap" style="gap:14px">
    <div class="legend" id="legend"></div>
    <div class="plist" id="plist"></div>
  </section>

</div>

/* ---- Zustand ---- */
const now=new Date(); const CUR=now.getMonth()+1; const YEAR=now.getFullYear();
let month=CUR, view="month";
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
try{const v=store.get("gk-view"); if(v==="plants") view="plants";}catch(e){}
const $=id=>document.getElementById(id);
const tc=t=>`var(${TYPES[t].c})`;
const label=p=>p.name+(p.sorte?` ${p.sorte}`:"");
const cnt=p=>p.n?`${p.n}×`:"";

function tasksFor(m){
  const out=[];
  PLANTS.forEach(p=>p.tasks.forEach((t,i)=>{ if(t[0].includes(m)) out.push({p,type:t[1],text:t[2],key:`gk-${YEAR}-${m}-${p.id}-${i}`}); }));
  return out;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function renderMonths(){
  $("months").innerHTML=MS.map((m,i)=>{
    const mm=i+1, ts=tasksFor(mm), done=ts.filter(t=>store.get(t.key)).length;
    const pct=ts.length?Math.round(done/ts.length*100):0;
    return `<button data-m="${mm}" aria-pressed="${mm===month}" aria-label="${MON[i]}, ${ts.length} Aufgaben">${m}<span class="bar"><i style="width:${pct}%"></i></span>${mm===CUR?'<span class="now">jetzt</span>':''}</button>`;
  }).join("");
}
function renderMonth(){
  const ts=tasksFor(month);
  $("title").textContent=MON[month-1];
  const blooming=PLANTS.filter(p=>p.bloom.includes(month));
  $("bloom").innerHTML=blooming.length?`<span class="lbl">Blüht jetzt</span>`+blooming.map(p=>`<span class="chip">${esc(label(p))}</span>`).join(""):`<span class="lbl">Blüht jetzt</span><span style="color:var(--muted)">nichts – Ruhezeit</span>`;
  const done=ts.filter(t=>store.get(t.key)).length;
  $("sub").textContent=`${ts.length} Aufgaben in diesem Monat`;
  $("progTxt").textContent=`${done} von ${ts.length} erledigt`;
  $("progBar").style.width=(ts.length?done/ts.length*100:0)+"%";
  if(!ts.length){$("groups").innerHTML=`<div class="empty">In diesem Monat gibt es nichts zu tun.</div>`;return}
  $("groups").innerHTML=ORDER.filter(t=>ts.some(x=>x.type===t)).map(t=>{
    const list=ts.filter(x=>x.type===t);
    return `<div class="group" style="--tc:${tc(t)}"><h2><span class="dot"></span>${TYPES[t].n} <small>${list.length}</small></h2>`+
      list.map(x=>{const d=!!store.get(x.key);return `<label class="task${d?' done':''}"><input type="checkbox" id="${x.key}" data-k="${x.key}"${d?' checked':''}><span class="txt"><span class="who">${esc(label(x.p))} <span>${cnt(x.p)}</span></span><br><span class="what">${esc(x.text)}</span></span></label>`}).join("")+`</div>`;
  }).join("");
}
function renderPlants(){
  $("title").textContent="Meine Pflanzen";
  $("sub").textContent="Jahresübersicht pro Pflanze – antippen für Details";
  $("legend").innerHTML=`<span><i class="b"></i>Blütezeit</span>`+ORDER.map(t=>`<span style="--tc:${tc(t)}"><i></i>${TYPES[t].n}</span>`).join("");
  let lastCat="";
  $("plist").innerHTML=PLANTS.map(p=>{
    let head="";
    if(p.cat!==lastCat){lastCat=p.cat; head=`<div class="cat" style="margin-top:8px">${p.cat}</div>`;}
    const year=MS.map((m,i)=>{const mm=i+1;const types=ORDER.filter(t=>p.tasks.some(x=>x[1]===t&&x[0].includes(mm)));
      return `<div><span class="m">${m[0]}</span><span class="cell${p.bloom.includes(mm)?' bl':''}${mm===month?' cur':''}">${types.map(t=>`<i style="--tc:${tc(t)}"></i>`).join("")}</span></div>`}).join("");
    const rows=[];
    for(let mm=1;mm<=12;mm++) p.tasks.forEach(x=>{if(x[0][0]===mm) rows.push(x)});
    const tl=rows.map(x=>`<li style="--tc:${tc(x[1])}"><span><b>${x[0].map(m=>MS[m-1]).join("–").replace(/^(\w+)–.*–(\w+)$/,"$1–$2")}</b><span class="ty">${TYPES[x[1]].n.split(" ")[0]}</span></span><span>${esc(x[2])}</span></li>`).join("");
    return head+`<details class="plant" id="d-${p.id}"><summary><div style="min-width:0"><div class="pname">${p.n?`<span class="n">${p.n}×</span>`:""}${esc(label(p))}</div>${p.bot?`<div class="pbot">${esc(p.bot)}</div>`:""}</div><div class="year">${year}</div></summary><div class="pbody">${p.note?`<div class="note">${esc(p.note)}</div>`:""}<ul class="tl">${tl}</ul></div></details>`;
  }).join("");
}
function render(){
  $("vMonth").setAttribute("aria-pressed",view==="month");
  $("vPlants").setAttribute("aria-pressed",view==="plants");
  $("monthView").hidden=view!=="month"; $("plantView").hidden=view!=="plants";
  renderMonths();
  view==="month"?renderMonth():renderPlants();
}
$("months").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;month=+b.dataset.m;render()});
$("groups").addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;store.set(k,e.target.checked?"1":"");renderMonths();renderMonth()});
$("vMonth").onclick=()=>{view="month";store.set("gk-view","month");render()};
$("vPlants").onclick=()=>{view="plants";store.set("gk-view","plants");render()};
$("plantTotal").textContent=PLANTS.reduce((a,p)=>a+(p.n||0),0)+"+";
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
